name: Terminal markup hotfix

on:
  push:
    branches: [agent/v1.0.1-terminal-markup-hotfix]
    paths:
      - .github/workflows/terminal-markup-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.0.1-terminal-markup-hotfix
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Экранирование динамического Spectre markup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $content = Get-Content -LiteralPath $Path -Raw
            if (-not $content.Contains($Old)) {
              throw "Не найден ожидаемый фрагмент в $Path`n$Old"
            }
            $content = $content.Replace($Old, $New)
            Set-Content -LiteralPath $Path -Value $content -Encoding utf8NoBOM
          }

          $nexus = 'src/WinState.Terminal/CyberNexusShell.cs'
          Replace-Exact $nexus `
            '.UseConverter(item => $"{item.Title} [grey]// {item.Description}[/]")' `
            '.UseConverter(item => $"[bold green]{Markup.Escape(item.Title)}[/] [grey]// {Markup.Escape(item.Description)}[/]")'

          Replace-Exact $nexus `
            '.HighlightStyle(new Style(Color.Black, Color.Green1))
                .AddChoices(files.Concat([back])))' `
            '.HighlightStyle(new Style(Color.Black, Color.Green1))
                .UseConverter(Markup.Escape)
                .AddChoices(files.Concat([back])))'

          Replace-Exact $nexus `
            '.UseConverter(item => item.TransactionId == "← RETURN"
                    ? item.TransactionId
                    : $"{item.StartedAt.ToLocalTime():yyyy-MM-dd HH:mm} // {item.TransactionId} // {item.Status}")' `
            '.UseConverter(item => item.TransactionId == "← RETURN"
                    ? Markup.Escape(item.TransactionId)
                    : Markup.Escape($"{item.StartedAt.ToLocalTime():yyyy-MM-dd HH:mm} // {item.TransactionId} // {item.Status}"))'

          $terminal = 'src/WinState.Terminal/CyberTerminalShell.cs'
          Replace-Exact $terminal `
            '.UseConverter(item => $"[bold green]{item.Title}[/]  [grey]// {item.Description}[/]")' `
            '.UseConverter(item => $"[bold green]{Markup.Escape(item.Title)}[/]  [grey]// {Markup.Escape(item.Description)}[/]")'

          Replace-Exact $terminal `
            '? item.Name
                        : $"[green]›[/] {item.Name,-32} [grey]{FormatBytes(item.SizeBytes),8}  {item.ModifiedAt:yyyy-MM-dd HH:mm}[/]")' `
            '? Markup.Escape(item.Name)
                        : $"[green]›[/] {Markup.Escape(item.Name),-32} [grey]{FormatBytes(item.SizeBytes),8}  {item.ModifiedAt:yyyy-MM-dd HH:mm}[/]")'

          Replace-Exact $terminal `
            '? item.ProfileName
                    : $"[green]›[/] {item.CreatedAt:yyyy-MM-dd HH:mm:ss}  {item.Status,-16}  {item.ProfileName}  [grey]{item.ActionCount} action(s)[/]")' `
            '? Markup.Escape(item.ProfileName)
                    : $"[green]›[/] {item.CreatedAt:yyyy-MM-dd HH:mm:ss}  {Markup.Escape(item.Status),-16}  {Markup.Escape(item.ProfileName)}  [grey]{item.ActionCount} action(s)[/]")'

          Replace-Exact $terminal `
            '? item.Name
                    : $"[green]›[/] {item.Name,-34} [grey]{FormatBytes(item.SizeBytes),8}[/]")' `
            '? Markup.Escape(item.Name)
                    : $"[green]›[/] {Markup.Escape(item.Name),-34} [grey]{FormatBytes(item.SizeBytes),8}[/]")'

      - name: Сборка и тесты
        run: |
          dotnet restore WinState.sln
          dotnet build WinState.sln --configuration Release --no-restore
          dotnet test WinState.sln --configuration Release --no-build
      - name: Сохранение исправления
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/WinState.Terminal/CyberNexusShell.cs src/WinState.Terminal/CyberTerminalShell.cs
          git commit -m 'fix: escape nested terminal menu markup'
          git push origin HEAD:agent/v1.0.1-terminal-markup-hotfix
