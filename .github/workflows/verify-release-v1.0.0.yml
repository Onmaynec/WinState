name: Проверка релиза v1.0.0

on:
  push:
    branches: [release/verify-result-v1.0.0]
    paths-ignore:
      - release-verification-v1.0.0.json

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ожидание опубликованного релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if release=$(gh api repos/${{ github.repository }}/releases/tags/v1.0.0 2>/dev/null); then
              assets=$(jq '.assets | length' <<<"$release")
              if [ "$assets" -ge 5 ]; then
                printf '%s' "$release" > "$RUNNER_TEMP/release.json"
                exit 0
              fi
            fi
            echo "Релиз ещё собирается: попытка $attempt/90"
            sleep 10
          done
          echo "Релиз v1.0.0 не был опубликован вовремя." >&2
          exit 1
      - name: Загрузка assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download v1.0.0 --repo '${{ github.repository }}' --dir "$RUNNER_TEMP/assets"
          ls -lah "$RUNNER_TEMP/assets"
      - name: Проверка assets, SHA-256 и markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          expected=(
            SHA256SUMS
            WinState-1.0.0-win-x64.zip
            WinState-1.0.0-win-x64.zip.sha256
            WinState-1.0.0-win-arm64.zip
            WinState-1.0.0-win-arm64.zip.sha256
          )
          for file in "${expected[@]}"; do
            test -f "$file" || { echo "Нет asset: $file" >&2; exit 1; }
          done

          verify_archive() {
            runtime="$1"
            archive="WinState-1.0.0-$runtime.zip"
            expected_hash=$(tr -d '\r\n' < "$archive.sha256" | awk '{print tolower($1)}')
            actual_hash=$(sha256sum "$archive" | awk '{print tolower($1)}')
            test "$expected_hash" = "$actual_hash" || { echo "SHA-256 mismatch: $runtime" >&2; exit 1; }

            extract="$RUNNER_TEMP/extract-$runtime"
            mkdir -p "$extract"
            unzip -q "$archive" -d "$extract"
            test -f "$extract/winstate.exe"
            test -f "$extract/winstate.release.json"
            marker_version=$(jq -r .version "$extract/winstate.release.json")
            marker_runtime=$(jq -r .runtime "$extract/winstate.release.json")
            marker_product=$(jq -r .product "$extract/winstate.release.json")
            marker_signed=$(jq -r .authenticodeSigned "$extract/winstate.release.json")
            test "$marker_version" = "1.0.0"
            test "$marker_runtime" = "$runtime"
            test "$marker_product" = "WinState"
            jq -n \
              --arg runtime "$runtime" \
              --arg sha256 "$actual_hash" \
              --argjson size "$(stat -c%s "$archive")" \
              --argjson authenticodeSigned "$marker_signed" \
              '{runtime:$runtime,sha256:$sha256,size:$size,marker:true,authenticodeSigned:$authenticodeSigned}' \
              > "$RUNNER_TEMP/$runtime.json"
          }

          verify_archive win-x64
          verify_archive win-arm64

          x64_hash=$(jq -r .sha256 "$RUNNER_TEMP/win-x64.json")
          arm64_hash=$(jq -r .sha256 "$RUNNER_TEMP/win-arm64.json")
          grep -qi "$x64_hash.*WinState-1.0.0-win-x64.zip" SHA256SUMS
          grep -qi "$arm64_hash.*WinState-1.0.0-win-arm64.zip" SHA256SUMS

          release=$(cat "$RUNNER_TEMP/release.json")
          latest_tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          target=$(gh api repos/${{ github.repository }}/git/ref/tags/v1.0.0 --jq .object.sha)
          assets=$(jq '[.assets[].name] | sort' <<<"$release")
          archives=$(jq -s '.' "$RUNNER_TEMP/win-x64.json" "$RUNNER_TEMP/win-arm64.json")
          jq -n \
            --argjson schemaVersion 1 \
            --arg verifiedAtUtc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg tag v1.0.0 \
            --arg mergeCommit ce21602b0afc1b6393c179dc81a7b5a6ff032745 \
            --arg targetCommit "$target" \
            --arg releaseName "$(jq -r .name <<<"$release")" \
            --argjson draft "$(jq .draft <<<"$release")" \
            --argjson prerelease "$(jq .prerelease <<<"$release")" \
            --argjson latest "$([ "$latest_tag" = v1.0.0 ] && echo true || echo false)" \
            --argjson assets "$assets" \
            --argjson archives "$archives" \
            '{schemaVersion:$schemaVersion,verifiedAtUtc:$verifiedAtUtc,tag:$tag,mergeCommit:$mergeCommit,targetCommit:$targetCommit,draft:$draft,prerelease:$prerelease,latest:$latest,releaseName:$releaseName,assets:$assets,archives:$archives}' \
            > "$RUNNER_TEMP/release-verification-v1.0.0.json"
      - name: Сохранение проверяемого результата
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/release-verification-v1.0.0.json"
          content=$(base64 -w0 "$file")
          endpoint="repos/${{ github.repository }}/contents/release-verification-v1.0.0.json"
          existing=$(gh api "$endpoint?ref=release/verify-result-v1.0.0" --jq .sha 2>/dev/null || true)
          if [ -n "$existing" ]; then
            gh api --method PUT "$endpoint" \
              -f message='release: зафиксировать проверку v1.0.0' \
              -f content="$content" \
              -f branch='release/verify-result-v1.0.0' \
              -f sha="$existing"
          else
            gh api --method PUT "$endpoint" \
              -f message='release: зафиксировать проверку v1.0.0' \
              -f content="$content" \
              -f branch='release/verify-result-v1.0.0'
          fi
