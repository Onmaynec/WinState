name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WinState.sln
      - name: Build
        run: dotnet build WinState.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test WinState.sln --configuration Release --no-build
      - name: CLI help smoke test
        run: dotnet run --project src/WinState.Cli --configuration Release --no-build -- --help
      - name: Version smoke test
        shell: pwsh
        run: |
          $version = dotnet run --project src/WinState.Cli --configuration Release --no-build -- --version
          if ($LASTEXITCODE -ne 0) { throw "Version command failed." }
          if ($version -notmatch "0.7.0-alpha.1") { throw "Unexpected WinState version: $version" }
      - name: Profile Engine smoke tests
        shell: pwsh
        run: |
          dotnet run --project src/WinState.Cli --configuration Release --no-build -- validate samples/profile-engine/workstation.yaml --var developerName=CI --var mode=true
          if ($LASTEXITCODE -ne 0) { throw "Base Profile Engine smoke failed." }
          dotnet run --project src/WinState.Cli --configuration Release --no-build -- validate samples/packages-features/developer-workstation.yaml
          if ($LASTEXITCODE -ne 0) { throw "Packages/features profile validation failed." }
      - name: Forge Control Fabric smoke test
        shell: pwsh
        run: |
          $stateHome = Join-Path $PWD ".ci-winstate"
          $output = dotnet run --project src/WinState.Cli --configuration Release --no-build -- ui --demo --home $stateHome | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Forge demo failed." }
          if ($output -notmatch "FORGE CONTROL FABRIC") { throw "Forge signature was not rendered." }
          if ($output -notmatch "PACKAGE & FEATURE FORGE") { throw "Package Forge panel was not rendered." }
          if ($output -notmatch "packages.winget") { throw "WinGet provider was not rendered." }
          if ($output -notmatch "windows.features") { throw "Features provider was not rendered." }
          Write-Host $output
      - name: Environment Provider status
        shell: pwsh
        run: |
          $stateHome = Join-Path $PWD ".ci-winstate"
          dotnet run --project src/WinState.Cli --configuration Release --no-build -- environment status --home $stateHome
      - name: Windows provider prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $winget = winget --version
          if ($LASTEXITCODE -ne 0) { throw "winget is not available." }
          Write-Host "winget: $winget"
          $dism = dism.exe /Online /Get-Features /Format:Table /English | Select-Object -First 12
          if ($LASTEXITCODE -ne 0) { throw "DISM feature inventory failed." }
          Write-Host $dism
      - name: Environment Provider Windows vertical slice
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stateHome = Join-Path $PWD ".ci-winstate"
          $profile = Join-Path $PWD "samples/environment-provider/user-sandbox.yaml"

          dotnet run --project src/WinState.Cli --configuration Release --no-build -- environment plan $profile --home $stateHome
          if ($LASTEXITCODE -ne 0) { throw "Environment plan failed." }

          dotnet run --project src/WinState.Cli --configuration Release --no-build -- environment apply $profile --yes --home $stateHome
          if ($LASTEXITCODE -ne 0) { throw "Environment apply failed." }

          $manifest = Get-ChildItem -LiteralPath (Join-Path $stateHome "backups/environment") -Filter manifest.json -File -Recurse |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $manifest) { throw "Environment checkpoint manifest was not created." }

          dotnet run --project src/WinState.Cli --configuration Release --no-build -- environment rollback $manifest.FullName --yes --home $stateHome
          if ($LASTEXITCODE -ne 0) { throw "Environment rollback failed." }

          $variable = [Environment]::GetEnvironmentVariable("WINSTATE_ENV_PROVIDER_SAMPLE", "User")
          if ($null -ne $variable) { throw "Rollback did not remove the sample user variable." }

          $expectedPath = [IO.Path]::GetFullPath((Join-Path $PWD "samples/environment-provider/tools"))
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($userPath -split ';') -contains $expectedPath) { throw "Rollback did not restore the user PATH." }
      - name: Doctor and storage smoke tests
        shell: pwsh
        run: |
          $stateHome = Join-Path $PWD ".ci-winstate"
          dotnet run --project src/WinState.Cli --configuration Release --no-build -- doctor --home $stateHome
          dotnet run --project src/WinState.Cli --configuration Release --no-build -- storage status --home $stateHome
      - name: Self-update package smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\scripts\package.ps1 -Runtime win-x64 -Version 0.7.0-alpha.1
          $archive = Join-Path $PWD "artifacts/WinState-0.7.0-alpha.1-win-x64.zip"
          $checksum = "$archive.sha256"
          if (-not (Test-Path $archive)) { throw "Release ZIP was not created." }
          if (-not (Test-Path $checksum)) { throw "SHA-256 file was not created." }
          $extract = Join-Path $PWD ".ci-package"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract "winstate.release.json"))) { throw "Release marker is missing." }
          if (-not (Test-Path (Join-Path $extract "winstate.exe"))) { throw "Windows apphost is missing." }
