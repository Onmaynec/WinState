name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore WinState.sln
      - name: Test
        run: dotnet test WinState.sln --configuration Release
      - name: Build win-x64 package
        shell: pwsh
        run: .\scripts\package.ps1 -Runtime win-x64 -Version ($env:GITHUB_REF_NAME).TrimStart('v')
      - name: Build win-arm64 package
        shell: pwsh
        run: .\scripts\package.ps1 -Runtime win-arm64 -Version ($env:GITHUB_REF_NAME).TrimStart('v')
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
