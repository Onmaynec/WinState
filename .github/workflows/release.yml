name: Публикация релиза

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: Сборка и публикация
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Подготовка метаданных релиза
        id: meta
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) {
            New-Item (Split-Path $notes) -ItemType Directory -Force | Out-Null
            @"
          # WinState $version

          Подробности изменений находятся в CHANGELOG.md.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8
          }
          $titleLine = Get-Content -LiteralPath $notes | Where-Object { $_ -match '^# ' } | Select-Object -First 1
          $title = if ($titleLine) { $titleLine.Substring(2).Trim() } else { "WinState $version" }
          $isPrerelease = $tag.Contains('-')
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "latest=$(((-not $isPrerelease)).ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Восстановление зависимостей
        run: dotnet restore WinState.sln
      - name: Сборка
        run: dotnet build WinState.sln --configuration Release --no-restore
      - name: Тесты
        run: dotnet test WinState.sln --configuration Release --no-build
      - name: Импорт сертификата Authenticode
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINSTATE_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINSTATE_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "thumbprint=" >> $env:GITHUB_OUTPUT
            Write-Host "Сертификат не настроен: пакеты будут опубликованы без Authenticode."
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "winstate-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $securePassword = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $certificate -or -not $certificate.HasPrivateKey) {
            throw "Сертификат Authenticode не импортирован или не содержит private key."
          }
          Remove-Item $certificatePath -Force
          "enabled=true" >> $env:GITHUB_OUTPUT
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Сборка Windows x64
        shell: pwsh
        run: .\scripts\package.ps1 -Runtime win-x64 -Version '${{ steps.meta.outputs.version }}' -SigningThumbprint '${{ steps.signing.outputs.thumbprint }}'
      - name: Сборка Windows ARM64
        shell: pwsh
        run: .\scripts\package.ps1 -Runtime win-arm64 -Version '${{ steps.meta.outputs.version }}' -SigningThumbprint '${{ steps.signing.outputs.thumbprint }}'
      - name: Проверка release markers
        shell: pwsh
        run: |
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            $marker = Get-Content -LiteralPath "artifacts/publish-$runtime/winstate.release.json" -Raw | ConvertFrom-Json
            if ($marker.version -ne '${{ steps.meta.outputs.version }}') { throw "Некорректная версия marker: $runtime" }
            if ($marker.runtime -ne $runtime) { throw "Некорректный runtime marker: $runtime" }
            $expectedSigning = '${{ steps.signing.outputs.enabled }}' -eq 'true'
            if ([bool]$marker.authenticodeSigned -ne $expectedSigning) { throw "Некорректный Authenticode marker: $runtime" }
          }
      - name: Общий файл контрольных сумм
        shell: pwsh
        run: |
          Get-Content artifacts/*.zip.sha256 | Set-Content artifacts/SHA256SUMS -Encoding utf8
      - name: Удаление сертификата из runner store
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: Remove-Item 'Cert:\CurrentUser\My\${{ steps.signing.outputs.thumbprint }}' -Force -ErrorAction SilentlyContinue
      - name: Публикация GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.meta.outputs.notes }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.latest }}
          generate_release_notes: false
          files: |
            artifacts/*.zip
            artifacts/*.sha256
            artifacts/SHA256SUMS
